  <rect x="3" y="3" width="52" height="52" fill="#27f5a9" stroke="#1a1a1a" stroke-width="5"/>
  <g fill="#1a1a1a">
    <!-- S -->
    <rect x="12" y="16" width="17" height="6"/>
    <rect x="12" y="16" width="6" height="16"/>
    <rect x="12" y="26" width="17" height="6"/>
    <rect x="23" y="26" width="6" height="16"/>
    <rect x="12" y="36" width="17" height="6"/>
    <!-- C -->
    <rect x="33" y="16" width="14" height="6"/>
    <rect x="33" y="16" width="6" height="26"/>
    <rect x="33" y="36" width="14" height="6"/>
  </g>
</svg>
